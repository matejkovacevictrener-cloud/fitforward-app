<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Forward</title>
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fit Forward">
<meta name="application-name" content="Fit Forward">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" id="mf" href="manifest.webmanifest">
<style>
  html,body{margin:0;background:#080808;color:#F3F0ED;font-family:Exo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  #ffboot{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
  #ffboot img{width:88px;height:88px;border-radius:22px}
  #ffboot .t{font-size:18px;font-weight:600}
  #ffboot .s{font-size:14px;color:#9A9A9A;line-height:1.5;max-width:320px}
  #ffboot .sp{width:26px;height:26px;border-radius:50%;border:3px solid rgba(243,240,237,.18);border-top-color:#B8735A;animation:ffr .8s linear infinite}
  #ffboot button{min-height:48px;min-width:200px;border:0;border-radius:14px;background:#B8735A;color:#080808;font:600 15px inherit;font-family:inherit}
  @keyframes ffr{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ffboot"><img src="icon-192.png" alt=""><div class="sp"></div><div class="t">Fit Forward</div><div class="s">Učitavam…</div></div>
<script>
/* Fit Forward – samostalna web aplikacija.
 * Sučelje i sva logika su u Google Apps Scriptu (iste tablice, iste funkcije kao i do sada).
 * Ova stranica: pamti klijentov kod, pokazuje zadnje spremljeno sučelje odmah (brz ulazak s ikone),
 * u pozadini dohvati najnovije i sve pozive šalje istom Apps Scriptu. */
(function(){
'use strict';
var API = 'https://script.google.com/macros/s/AKfycbwENVDy1BtT1cpndEtN9jy5N1LJUTpEPMWoEyCtM06uad9bmzfgHVCo5QOO32gCrTM/exec';
var SHELL_V = '1';

function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function boot(title, text, retry){
  var b = document.getElementById('ffboot'); if (!b) return;
  b.innerHTML = '<img src="icon-192.png" alt=""><div class="t">' + title + '</div><div class="s">' + text + '</div>' + (retry ? '<button id="ffretry">Pokušaj ponovno</button>' : '');
  var r = document.getElementById('ffretry'); if (r) r.onclick = function(){ location.reload(); };
}

/* ---------- kod klijenta: iz linka (?k= ili #k=), inače zapamćen na mobitelu ---------- */
var u = new URL(location.href);
var K = (u.searchParams.get('k') || (location.hash.match(/k=([A-Za-z0-9_-]+)/) || [])[1] || '').replace(/[^A-Za-z0-9_-]/g, '');
if (K) ls('ff_k', K); else K = ls('ff_k') || '';
if (!K) { boot('Link nije potpun', 'Otvori link koji ti je poslao trener. Nakon toga aplikaciju možeš dodati na početni zaslon.'); return; }
// adresa uvijek nosi kod – ikona na početnom zaslonu tako otvara baš tvoju aplikaciju
if (u.searchParams.get('k') !== K) { u.searchParams.set('k', K); u.hash = ''; try { history.replaceState(history.state, '', u.toString()); } catch (e) {} }

// manifest s tvojim kodom (Android/Chrome: ikona otvara tvoju aplikaciju)
try {
  var base = location.origin + location.pathname.replace(/[^/]*$/, '');
  var mf = { name: 'Fit Forward', short_name: 'Fit Forward', description: 'Tvoj trening, prehrana i napredak',
    start_url: base + '?k=' + K, scope: base, id: base, display: 'standalone', orientation: 'portrait',
    background_color: '#080808', theme_color: '#080808', lang: 'hr',
    icons: [{ src: base + 'icon-192.png', sizes: '192x192', type: 'image/png' },
            { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png' },
            { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
  document.getElementById('mf').setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(mf)));
} catch (e) {}

/* ---------- google.script.run → isti pozivi preko interneta ---------- */
function call(fn, args){
  return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args }) })
    .then(function(r){ return r.text().then(function(t){ var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Google se nije ispravno javio (HTTP ' + r.status + ').'); } return j; }); })
    .then(function(j){ if (!j.ok) throw new Error(j.e || 'Greška'); return j.r; });
}
function runner(ok, fail, uo){
  return new Proxy({}, { get: function(_, name){
    if (name === 'withSuccessHandler') return function(h){ return runner(h, fail, uo); };
    if (name === 'withFailureHandler') return function(h){ return runner(ok, h, uo); };
    if (name === 'withUserObject') return function(o){ return runner(ok, fail, o); };
    if (typeof name !== 'string') return undefined;
    return function(){ var a = Array.prototype.slice.call(arguments);
      call(name, a).then(function(r){ if (ok) ok(r, uo); }, function(e){ if (fail) fail(e, uo); }); };
  } });
}
window.google = { script: {
  run: runner(null, null, undefined),
  history: {
    push: function(state){ try { history.pushState({ ff: 1, s: state }, '', location.href); } catch (e) {} },
    replace: function(state){ try { history.replaceState({ ff: 1, s: state }, '', location.href); } catch (e) {} },
    setChangeHandler: function(fn){ window.addEventListener('popstate', function(e){ try { fn({ state: e.state && e.state.s, location: {} }); } catch (x) {} }); }
  },
  url: { getLocation: function(cb){ cb({ hash: '', parameter: { k: K }, parameters: { k: [K] } }); } },
  host: { close: function(){}, setHeight: function(){}, setWidth: function(){}, editor: {} }
} };

/* ---------- sučelje: odmah zadnje spremljeno, u pozadini najnovije ---------- */
var UI_KEY = 'ff_ui_' + K;
function inject(html){
  var doc = new DOMParser().parseFromString(html, 'text/html');
  doc.head.querySelectorAll('style, link[rel="stylesheet"], link[rel="preconnect"]').forEach(function(n){ document.head.appendChild(document.importNode(n, true)); });
  var scripts = Array.prototype.slice.call(doc.body.querySelectorAll('script'));
  scripts.forEach(function(s){ s.parentNode.removeChild(s); });
  if (doc.body.className) document.body.className = doc.body.className;
  document.body.innerHTML = doc.body.innerHTML;
  scripts.forEach(function(s){ var e = document.createElement('script'); e.textContent = s.textContent; document.body.appendChild(e); });
}
function fetchUi(){
  return fetch(API + '?api=ui&k=' + encodeURIComponent(K) + '&sv=' + SHELL_V, { credentials: 'omit', redirect: 'follow' })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.e || 'Greška'); return j; });
}
var cached = null;
try { cached = JSON.parse(ls(UI_KEY) || 'null'); } catch (e) { cached = null; }
if (cached && cached.html) {
  inject(cached.html);
  fetchUi().then(function(j){ if (j.v !== cached.v) ls(UI_KEY, JSON.stringify({ v: j.v, at: Date.now(), html: j.html })); })   // nova verzija sučelja vrijedi od sljedećeg otvaranja
    .catch(function(e){ if (/LINK/.test(String(e && e.message))) { ls(UI_KEY, null); ls('ff_k', null); } });
} else {
  fetchUi().then(function(j){ ls(UI_KEY, JSON.stringify({ v: j.v, at: Date.now(), html: j.html })); inject(j.html); })
    .catch(function(e){
      var m = String(e && e.message || e);
      if (/LINK/.test(m)) { ls('ff_k', null); return boot('Link nije ispravan', 'Otvori link koji ti je poslao trener. Ako i dalje ne radi, javi mu se.'); }
      boot(navigator.onLine === false ? 'Nema signala' : 'Nešto nije u redu', navigator.onLine === false ? 'Aplikacija treba internet za prvo otvaranje. Čim se signal vrati, pokušaj ponovno.' : 'Pokušaj ponovno za minutu. Ako se ponavlja, javi treneru.', true);
    });
}

/* ---------- rad bez signala (ljuska aplikacije) ---------- */
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
</body>
</html>
